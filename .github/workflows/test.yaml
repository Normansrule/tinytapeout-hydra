name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make returns success even if a test fails, so inspect results.xml.
          # NOTE: grep for the word "failure" is WRONG with cocotb 2.x, whose
          # JUnit output always carries the attribute failures="0" -- the
          # substring matched, and 8/8 passing runs were reported as failed
          # (HYDRA session 140). Check the counts instead.
          python3 - <<'EOF'
          import re, sys
          x = open("results.xml").read()
          f = sum(int(v) for v in re.findall(r'failures="(\d+)"', x))
          e = sum(int(v) for v in re.findall(r'errors="(\d+)"', x))
          t = sum(int(v) for v in re.findall(r'tests="(\d+)"', x))
          print(f"tests={t} failures={f} errors={e}")
          sys.exit(1 if (f or e or t == 0) else 0)
          EOF

      - name: Test Summary
        uses: test-summary/action@v2.3
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload vcd
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-vcd
          path: |
            test/tb.vcd
            test/results.xml
