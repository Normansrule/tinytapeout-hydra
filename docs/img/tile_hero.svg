6" y="376" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px" fill="#a9b6c6">4,197 warnings open</text><rect x="58" y="401" width="14" height="14" rx="2" fill="#d6a93c"/><text x="86" y="414" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Utilisation</text><text x="216" y="414" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px" fill="#a9b6c6">51.7% of the tile</text><rect x="58" y="439" width="14" height="14" rx="2" fill="#3dbb8a"/><text x="86" y="452" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#eef2f7">Gate level</text><text x="216" y="452" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px" fill="#a9b6c6">21 of 21, hardened netlist</text><text x="847.5" y="487.97267080745337" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px" fill="#a9b6c6">Not to scale: the pipeline as drawn in src/rtl/mom_top.sv</text></svg>
