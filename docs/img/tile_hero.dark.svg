oe UI',Roboto,sans-serif;font-size:15px;font-weight:650" fill="#ece8de">Crypto row</text><rect class="hl" style="animation-delay:2.4s" x="956" y="359" width="110" height="47" rx="4" fill="none" stroke="#ece8de" stroke-width="2.4"/><path d="M829,297 L956,382" stroke="#efac46" stroke-opacity=".35" stroke-width="1.2"/><text x="56" y="132" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:46px;font-weight:800;letter-spacing:-1.2px" fill="#ece8de">tt_um_hydra_mom</text><text x="58" y="180" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px" fill="#b9b5ab">The research tile: 4×4 Tiny Tapeout tiles.</text><text x="58" y="208" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px" fill="#b9b5ab">It costs five engines, picks the cheapest,</text><text x="58" y="236" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px" fill="#b9b5ab">and corrects its model from what happened.</text><rect x="58" y="287" width="14" height="14" rx="2" fill="#efac46"/><text x="86" y="300" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#ece8de">Timing</text><text x="216" y="300" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px" fill="#b9b5ab">66 ns, every corner (+14.06 ns)</text><rect x="58" y="325" width="14" height="14" rx="2" fill="#4cc6de"/><text x="86" y="338" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#ece8de">Sign-off</text><text x="216" y="338" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px" fill="#b9b5ab">DRC, LVS, antenna clean</text><rect x="58" y="363" width="14" height="14" rx="2" fill="#4cc6de"/><text x="86" y="376" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#ece8de">Slew</text><text x="216" y="376" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px" fill="#b9b5ab">1,230 warnings open</text><rect x="58" y="401" width="14" height="14" rx="2" fill="#4cc6de"/><text x="86" y="414" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#ece8de">Utilisation</text><text x="216" y="414" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px" fill="#b9b5ab">48.6% of the tile</text><rect x="58" y="439" width="14" height="14" rx="2" fill="#ac8ef6"/><text x="86" y="452" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:650" fill="#ece8de">Gate level</text><text x="216" y="452" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px" fill="#b9b5ab">22 of 22, hardened netlist</text><text x="847.5" y="487.97267080745337" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px" fill="#b9b5ab">Not to scale: the pipeline of src/rtl/mom_top.sv. The five rows are cost-table entries; no engine is on the tile.</text></svg>
