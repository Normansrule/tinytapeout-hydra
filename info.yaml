# TinyTapeout project metadata for TT-A: the HYDRA-130 Mathematical Operation MUX.
#
# v3, THE RESEARCH TILE (2026-10-09): 3x4, down from 4x4.
#
#     v2 (signed off 2026-10-05, 4x4)  147,278 um^2 by yosys + abc   67.3% by LibreLane
#     v3 (this)                         113,939 um^2, 11,964 cells    ~70% expected at 3x4
#
# What came out (see src/tt_um_hydra_mom.sv): the v1 pin personality and its
# 128-bit shift register, the LASTWD readback (which kept 128 descriptor bits
# alive through the whole pipeline), and four of the eight tags. The full
# dispatcher, with all of that, is in the HYDRA-130 chip (hydra-skywater130,
# mom/). Twelve tiles instead of sixteen is a quarter off the tile cost, and
# 23% fewer cells (15,574 -> 11,964) is less to clock and to leak.
#
# The ~70% is an ESTIMATE: v2's LibreLane utilisation was 1.27x its yosys
# area, applied to v3. PL_TARGET_DENSITY_PCT is raised to 70 in
# src/config.json to match (TinyTapeout's own comment there says up to 80 has
# worked). If the harden fails placement or routing, change `tiles` back to
# "4x4" -- one line, nothing else depends on it -- and the design still saves
# the power.
#
# ---------------------------------------------------------------------------
# Earlier sizing notes, kept for the record:
#
# TILE SIZING — MEASURED against the real sky130 Liberty, not estimated.
#
#     13,734 sky130_fd_sc_hd cells
#     110,796 um^2 of cell area, as the library reports it
#
#     3x2 = 114,858 um^2   96% utilisation, too tight
#     4x2 = 154,113 um^2   72%, too tight for routing
#     3x4 = 260,160 um^2   43%, CHOSEN
#
# Those figures come from tt-support-tools/tile_sizes.yaml, which is the list
# the tooling actually uses. A session briefly changed this to 6x2 on the
# strength of the template's info.yaml comment, which abbreviates the valid
# set to the two-row sizes and omits 3x4, 4x4 and 5x4. The template comment is
# not authoritative; tile_sizes.yaml is.
#
# The earlier estimate said 100,191 um^2 from generic-gate counts and a 0.70
# remap factor. The real number is 11% larger. The tile choice is unchanged,
# but it was right with less margin than the estimate claimed -- and across
# other blocks the same estimate was low by as much as 53%, non-uniformly,
# because a single hand-applied constant cannot track the flop-to-logic ratio.
#
# Regenerate with tools/timing.sh, which maps to real cells:
#
#     LIB=/path/to/sky130_fd_sc_hd__tt_025C_1v80.lib \
#       ./tools/timing.sh tt_um_hydra_mom <sources>
#
# Session 131, remeasured with Yosys 0.33 against the PDK's own liberty, then
# placed and globally routed in OpenROAD on TinyTapeout's 3x4 DEF template
# (tools/tt_synth.sh, tools/openroad_tt.py):
#
#     20,207 cells, 127,028 um^2       50% of the 3x4 core, by OpenROAD
#     after taps and buffers            52%
#     global route                      zero overflow on every layer
#     20 MHz clock                      +18.1 ns slack after CTS and routing
#
# The cell count is 47% above the 13,734 quoted above; the mapping differs
# between Yosys versions and ABC scripts, which is the 19% spread timing.sh
# warns about, plus a different liberty. The tile choice does not move: 4x2
# would be 82%, unroutable. 3x4 stays.
#
# HARDEN RESULT (session 139, real OpenLane 2 run on GitHub):
#   LVS: circuits match uniquely, PASS.  DRC: PASS.  Hold: clean at every
#   corner.  Setup: FAILED at 20 ns even at the typical corner -- the pre-PAR
#   OpenSTA figure below was combinational depth, and 20 ns never fit it at
#   signoff.  Fix: CLOCK_PERIOD raised to 55 ns (~18 MHz) in src/config.json,
#   plus setup-side resizer margins and antenna repair (25 pin + 22 net
#   antenna violations were reported).  clock_hz is now 18 MHz to match, above the 46.56 ns measured path.
#   Re-run pending; read design__instance__utilization and timing__setup__ws
#   from the run's metrics before ordering. Cell area is not die area.
#
# Do NOT hand-edit src/config.json to force a smaller die. That is what broke
# the ASICirific submission: a config missing FP_SIZING made LibreLane ignore
# DIE_AREA, DRC and LVS passed against the wrong die, and the only symptom was
# a boundary XOR failure that read as a tool bug. Three weeks.

project:
  title:        "TinyTapeout-Hydra"
  author:       "Aleksander J. Norman"
  discord:      ""
  description:  "Research tile: hardware dispatch across five compute engines using a roofline cost model that calibrates itself online from measured completion times. One shared cost engine evaluates all five in about thirteen cycles. An SPI register map reaches the whole dispatcher, including live retuning of the cost model."
  # The design is written in SystemVerilog, but what is SUBMITTED is
  # src/project.v, which sv2v converts to Verilog-2005. This field describes
  # the submitted file.
  language:     "Verilog"
  # 25 MHz. The 20 MHz below was the pre-PAR estimate; the real harden
  # (session 139) failed setup at 20 ns and closes at 55 ns == ~18 MHz (OpenSTA measured 46.56 ns reg-to-reg).
  #
  # OpenSTA against the sky130 typical corner reports a 46.56 ns
  # register-to-register period for this netlist -- 21.5 MHz. The 25 MHz
  # previously declared here was never measured and the tile could not have
  # met it.
  #
  # Synthesis timing is pessimistic because it inserts no buffers, and the
  # worst fanout here is 71 -- modest, so place-and-route will recover less
  # than it would on a wide pipeline. Assuming it recovers enough to reach
  # 25 MHz is exactly the assumption that wastes a tapeout: the test harness
  # drives whatever this field says, and a part clocked past its limit fails.
  #
  # 20 MHz gives 50 ns against a measured 46.56 ns -- margin that exists
  # BEFORE any PAR improvement rather than depending on it. The MOM takes
  # about thirteen cycles (three before the cost engine was shared) per descriptor either way; nothing about the design cares.
  clock_hz:     15151515

  tiles: "3x4"          # v3: see the top of this file. v2 needed 4x4.

  top_module:  "tt_um_hydra_mom"

  source_files:
    - "project.v"

# Pin map. See src/tt_um_hydra_mom.sv; the register map is in src/rtl/hydra_tt_regs.sv.
pinout:
  ui[0]: "SCK - SPI clock, mode 0, at most clk/8"
  ui[1]: "COPI - SPI data in"
  ui[2]: "CSn - SPI chip select, active low"
  ui[3]: "unused"
  ui[4]: "unused"
  ui[5]: "unused"
  ui[6]: "unused"
  ui[7]: "unused"

  uo[0]: "CIPO - SPI data out"
  uo[1]: "irq - a sticky error flag is set"
  uo[2]: "engine[0] - engine of the last dispatch"
  uo[3]: "engine[1]"
  uo[4]: "engine[2]"
  uo[5]: "dispatched - sticky until CLEAR_STICKY"
  uo[6]: "any_busy - at least one tag outstanding"
  uo[7]: "ready - the dispatcher can accept a descriptor"

  uio[0]: "tag[0] - tag of the last dispatch (0 to 3)"
  uio[1]: "tag[1]"
  uio[2]: "tag[2] - always 0 (four tags)"
  uio[3]: "tag[3] - always 0"
  uio[4]: "margin[0] - 1 + floor(log2(runner-up margin)), 0 if none"
  uio[5]: "margin[1]"
  uio[6]: "margin[2]"
  uio[7]: "margin[3]"

yaml_version: 6
